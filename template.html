<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>JB Jézéquel · Links</title>
  <meta name="description" content="JB Jézéquel, co-founder of Evaboot and FullVision. YouTube, X, LinkedIn, Instagram, TikTok, Facebook, Substack.">
  <meta property="og:title" content="JB Jézéquel">
  <meta property="og:description" content="Co-founder of Evaboot and FullVision.">
  <meta property="og:image" content="https://links.jbjezequel.com/assets/jb.jpg">
  <link rel="icon" href="assets/jb.jpg">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    :root { --bg:#f6f5f2; --card:#ffffff; --ink:#15151a; --muted:#6b6b75; --line:#e7e5e0; --hover:#fbfaf8; }
    @media (prefers-color-scheme: dark) {
      :root { --bg:#0f0f12; --card:#18181d; --ink:#f2f2f4; --muted:#9a9aa5; --line:#26262d; --hover:#1e1e24; }
    }
    * { box-sizing:border-box; margin:0; }
    body { background:var(--bg); color:var(--ink); font-family:Inter, system-ui, -apple-system, sans-serif;
           -webkit-font-smoothing:antialiased; min-height:100vh; padding:56px 16px 40px; }
    main { max-width:440px; margin:0 auto; }
    header { text-align:center; margin-bottom:36px; }
    .avatar { width:104px; height:104px; border-radius:50%; object-fit:cover; display:block; margin:0 auto 18px;
              border:3px solid var(--card); box-shadow:0 1px 2px rgba(0,0,0,.06), 0 8px 24px rgba(0,0,0,.08); }
    h1 { font-size:24px; font-weight:700; letter-spacing:-.02em; }
    header p { color:var(--muted); font-size:15px; margin-top:6px; line-height:1.5; }
    .roles span { display:block; }
    .roles a { color:var(--ink); font-weight:600; text-decoration:underline; text-decoration-color:var(--line); text-underline-offset:3px; }
    .roles a:hover { text-decoration-color:var(--ink); }
    section { margin-bottom:28px; }
    h2 { font-size:13px; font-weight:600; color:var(--muted); margin:0 4px 10px; }
    .link { display:flex; align-items:center; gap:14px; padding:14px 16px; margin-bottom:10px; background:var(--card);
            border:1px solid var(--line); border-radius:14px; color:inherit; text-decoration:none;
            transition:transform .15s ease, border-color .15s ease, background .15s ease; }
    .link:hover { transform:translateY(-1px); border-color:var(--brand, var(--ink)); background:var(--hover); }
    .link:focus-visible { outline:2px solid var(--ink); outline-offset:2px; }
    .ico { width:40px; height:40px; border-radius:10px; display:grid; place-items:center; flex:none;
           background:var(--bg); }
    .ico svg { width:22px; height:22px; fill:var(--brand, var(--ink)); }
    .ico img { width:24px; height:24px; object-fit:contain; }
    .txt { display:flex; flex-direction:column; min-width:0; flex:1; }
    .label { font-weight:600; font-size:16px; }
    .sub { color:var(--muted); font-size:13.5px; margin-top:2px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
    .arrow { width:18px; height:18px; fill:none; stroke:var(--muted); stroke-width:2; stroke-linecap:round; stroke-linejoin:round; flex:none; }
    .link:hover .arrow { stroke:var(--ink); }
    footer { text-align:center; color:var(--muted); font-size:12.5px; margin-top:12px; }
    footer a { color:inherit; }
  </style>
</head>
<body>
  <main>
    <header>
      <img class="avatar" src="assets/jb.jpg" alt="JB Jézéquel" width="104" height="104">
      <h1>JB Jézéquel</h1>
      <p class="roles">
        <span>Co-founder @ <a href="https://evaboot.com/" target="_blank" rel="noopener">Evaboot</a> ($2M ARR)</span>
        <span>Co-Founder &amp; CEO @ <a href="https://fullvision.io/" target="_blank" rel="noopener">FullVision</a></span>
      </p>
    </header>
{{SOCIAL}}
{{COMPANIES}}
  </main>
<script>
/* Visit and click counts for the Links tab on GTM Social. No cookie, no id: one beacon per visit and per click. */
(function () {
  var END = "https://social.evaboot.com/links/click";
  var src = new URLSearchParams(location.search).get("s") || document.referrer || "";
  function send(data) {
    data.src = src;
    var body = JSON.stringify(data);
    if (!(navigator.sendBeacon && navigator.sendBeacon(END, body))) {
      fetch(END, { method: "POST", body: body, mode: "no-cors", keepalive: true }).catch(function () {});
    }
  }
  send({ e: "view" });
  document.addEventListener("click", function (ev) {
    var a = ev.target.closest && ev.target.closest("a[data-link]");
    if (a) send({ e: "click", link: a.getAttribute("data-link") });
  });
})();
</script>
</body>
</html>
